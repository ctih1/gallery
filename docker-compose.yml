services:
    web:
        build: .
        env_file:
            - .env
        ports:
            - "3001:3000"
        volumes:
            - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
            - ./areas.db:/app/areas.db:rw
            - ./ips.db:/app/ips.db:rw
        environment:
            NODE_ENV: production
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
